[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-discord"
version = "0.1.0"
description = "Open-source Discord operations, moderation, and agent framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Azure contributors"}]
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.4,<3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["azure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
